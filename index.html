<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-roboto">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6">TaskMaster</h1>
        <div class="flex justify-between items-center mb-4">
            <input id="taskInput" type="text" placeholder="Adicione uma nova tarefa" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="addTaskButton" class="ml-2 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <span class="lucide-icon" data-name="plus"></span>
            </button>
        </div>
        <ul id="taskList" class="space-y-2">
            <!-- Tarefas serão adicionadas aqui -->
        </ul>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskInput = document.getElementById('taskInput');
            const addTaskButton = document.getElementById('addTaskButton');
            const taskList = document.getElementById('taskList');

            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }

            function renderTasks() {
                taskList.innerHTML = '';
                tasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between p-2 bg-white rounded shadow';

                    const taskText = document.createElement('span');
                    taskText.className = task.completed ? 'line-through text-gray-500' : 'text-gray-800';
                    taskText.textContent = task.text;

                    const buttonsContainer = document.createElement('div');
                    buttonsContainer.className = 'space-x-2';

                    const completeButton = document.createElement('button');
                    completeButton.className = 'px-2 py-1 bg-green-500 text-white rounded hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500';
                    completeButton.innerHTML = '<span class="lucide-icon" data-name="check"></span>';
                    completeButton.addEventListener('click', () => {
                        tasks[index].completed = !tasks[index].completed;
                        saveTasks();
                        renderTasks();
                    });

                    const editButton = document.createElement('button');
                    editButton.className = 'px-2 py-1 bg-yellow-500 text-white rounded hover:bg-yellow-600 focus:outline-none focus:ring-2 focus:ring-yellow-500';
                    editButton.innerHTML = '<span class="lucide-icon" data-name="edit"></span>';
                    editButton.addEventListener('click', () => {
                        const newText = prompt('Editar tarefa:', task.text);
                        if (newText !== null) {
                            tasks[index].text = newText;
                            saveTasks();
                            renderTasks();
                        }
                    });

                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'px-2 py-1 bg-red-500 text-white rounded hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500';
                    deleteButton.innerHTML = '<span class="lucide-icon" data-name="trash"></span>';
                    deleteButton.addEventListener('click', () => {
                        tasks.splice(index, 1);
                        saveTasks();
                        renderTasks();
                    });

                    buttonsContainer.appendChild(completeButton);
                    buttonsContainer.appendChild(editButton);
                    buttonsContainer.appendChild(deleteButton);

                    li.appendChild(taskText);
                    li.appendChild(buttonsContainer);

                    taskList.appendChild(li);
                });
                if (window.lucide) lucide.createIcons();
            }

            addTaskButton.addEventListener('click', () => {
                const taskText = taskInput.value.trim();
                if (taskText) {
                    tasks.push({ text: taskText, completed: false });
                    taskInput.value = '';
                    saveTasks();
                    renderTasks();
                }
            });

            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addTaskButton.click();
                }
            });

            renderTasks();
        });
    </script>
</body>
</html>
